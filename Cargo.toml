[package]
name = "xlang"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
percent-encoding = "2.3"
ariadne = "0.4"
ahash = "0.8"
mimalloc = "0.1"
yansi = "1"

# 纯解释器包：完全不含 GUI 代码，编译产物为 xlang.exe。
# GUI 版是独立子包 gui/（编译产物 xlang_gui.exe），见 gui/Cargo.toml。
[workspace]
members = ["gui"]

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_mut = "allow"
unused_unsafe = "allow"
static_mut_refs = "allow"
non_snake_case = "allow"
# 本包无 gui feature，但共享源码里大量 #[cfg(feature = "gui")]（gui 子包启用）
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("gui"))'] }

[profile.dev]
incremental = false

[profile.release]
incremental = false
lto = "fat"
codegen-units = 1
